<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروفایل من | توسعه‌دهنده نرم‌افزار</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Tahoma, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            color: white;
            margin: 0 auto 20px auto;
            font-weight: bold;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #ffffff;
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: block;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.3s, transform 0.2s;
        }
        .github {
            background-color: #334155;
            color: #ffffff;
        }
        .github:hover {
            background-color: #475569;
            transform: translateY(-2px);
        }
        .linkedin {
            background-color: #2563eb;
            color: #ffffff;
        }
        .linkedin:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">AJ</div>
        <h1>علیرضا جنتی پور</h1>
        <p>دانشجوی مهندسی کامپیوتر و علاقه‌مند به توسعه نرم‌افزار، برنامه‌نویسی پایتون و طراحی سیستم‌های وب.</p>
        
        <div class="links">
            <a href="https://github.com/INAJP" target="_blank" class="btn github">پروفایل گیت‌هاب</a>
            <a href="https://linkedin.com/in/alireza-jannatipour" target="_blank" class="btn linkedin">پروفایل لینکدین</a>
        </div>
    </div>

</body>
</html>
